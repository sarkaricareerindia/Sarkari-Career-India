<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jobs Category</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .category-card {
            background: white;
            border-radius: 15px;
            padding: 25px 20px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
            border: 1px solid #eee;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .category-card h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .category-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .bihar {
            border-top: 5px solid #16a34a;
        }

        .central {
            border-top: 5px solid #2563eb;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .categories {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back">← Home</a>

        <div class="header">
            <h1>💼 Government Jobs</h1>
            <p>Find the latest government job vacancies by category</p>
        </div>

        <div class="categories">

            <!-- Bihar Jobs -->
            <a href="bihar-jobs.html" class="category-card bihar">
                <div class="icon">📍</div>

                <h2>Bihar Jobs</h2>

                <p>
                    BPSC, BTSC, Bihar Police, Teacher Jobs
                    and other Bihar government vacancies.
                </p>
            </a>


            <!-- Central Jobs -->
            <a href="central-jobs.html" class="category-card central">
                <div class="icon">🏛️</div>

                <h2>Central Jobs</h2>

                <p>
                    SSC, UPSC, Railway, Banking and other
                    Central Government vacancies.
                </p>
            </a>

        </div>

        <div class="footer">
            <p>© 2026 Government Jobs Portal</p>
        </div>

    </div>

</body>
</html>
