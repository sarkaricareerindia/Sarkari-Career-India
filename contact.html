<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us - Sarkari Career India</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #333;
      font-size: 16px;
    }

    .header {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: white;
      text-align: center;
      padding: 30px 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
    }

    .contact-card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .contact-card h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .contact-item {
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .contact-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .contact-item a {
      color: #0f766e;
      text-decoration: none;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      background: #0f766e;
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .submit-btn:hover {
      background: #0d9488;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">
    ← Home
  </a>

  <div class="header">
    <h1>☎ Contact Us</h1>
    <p>We would love to hear from you</p>
  </div>


  <!-- CONTACT INFORMATION -->

  <div class="contact-card">

    <h2>📩 Get in Touch</h2>

    <div class="contact-item">

      <strong>📧 Email</strong>

      <a href="mailto:contact@sarkaricareerindia.com">
        contact@sarkaricareerindia.com
      </a>

    </div>


    <div class="contact-item">

      <strong>☘ WhatsApp</strong>

      <a href="#">
        WhatsApp Channel
      </a>

    </div>


    <div class="contact-item">

      <strong>✈ Telegram</strong>

      <a href="#">
        Telegram Channel
      </a>

    </div>


    <div class="contact-item">

      <strong>◎ Instagram</strong>

      <a href="#">
        Instagram Page
      </a>

    </div>

  </div>


  <!-- CONTACT FORM -->

  <div class="contact-card">

    <h2>📝 Send Us a Message</h2>

    <form onsubmit="sendMessage(event)">

      <div class="form-group">

        <label>
          Your Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Your Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Message
        </label>

        <textarea
          id="message"
          placeholder="Write your message..."
          required
        ></textarea>

      </div>


      <button
        type="submit"
        class="submit-btn"
      >
        Send Message
      </button>

    </form>

  </div>


  <div class="footer">
    © 2026 Sarkari Career India
  </div>

</div>


<script>

function sendMessage(event) {

  event.preventDefault();

  alert(
    "Thank you! Your message has been received."
  );

}

</script>

</body>
</html>
